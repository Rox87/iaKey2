<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hotkeys Configuration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
            color: #334155;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        h1,
        h2 {
            color: #1e293b;
        }

        .section {
            margin-bottom: 40px;
        }

        .card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f1f5f9;
            position: relative;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .card-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .action-btn {
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
        }

        .delete-btn {
            background: #fca5a5;
            color: white;
        }

        .delete-btn:hover {
            background: #f87171;
        }

        .edit-btn {
            background: #fde047;
            color: #854d0e;
        }

        .edit-btn:hover {
            background: #facc15;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background: #93c5fd;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #60a5fa;
        }

        #hotkey-input {
            cursor: pointer;
            background-color: #f0f9ff;
            border-color: #bae6fd;
        }

        .recording {
            background-color: #fef08a !important;
            border-color: #fde047 !important;
        }

        .error {
            color: #f87171;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>AI Hotkeys Configuration</h1>

        <div class="section" id="providers-section">
            <h2>Providers</h2>
            <div id="providers-list"></div>

            <div class="card">
                <div class="card-title">Add New Provider</div>
                <form id="provider-form">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="p-name" placeholder="e.g. OpenAI, Local" required>
                    </div>
                    <div class="form-group">
                        <label>Base URL</label>
                        <input type="text" id="p-baseurl" placeholder="e.g. https://api.openai.com/v1" required>
                    </div>
                    <div class="form-group">
                        <label>API Key</label>
                        <input type="password" id="p-apikey" placeholder="sk-..." required>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit">Save Provider</button>
                        <button type="button" id="p-cancel" style="display:none; background:#cbd5e1; color:#334155;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="section" id="models-section">
            <h2>Models</h2>
            <div id="models-list"></div>

            <div class="card">
                <div class="card-title">Add New Model</div>
                <form id="model-form">
                    <div class="form-group">
                        <label>Name (Identifier)</label>
                        <input type="text" id="m-name" placeholder="e.g. Local Llama 3, OpenAI GPT-4" required>
                    </div>
                    <div class="form-group">
                        <label>Provider</label>
                        <select id="m-provider" required>
                            <option value="">Select a provider...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Model Name</label>
                        <input type="text" id="m-modelname" placeholder="e.g. gpt-4, llama3" required>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit">Save Model</button>
                        <button type="button" id="m-cancel" style="display:none; background:#cbd5e1; color:#334155;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="section" id="hotkeys-section">
            <h2>Hotkeys</h2>
            <div id="hotkeys-list"></div>

            <div class="card">
                <div class="card-title">Add New Hotkey</div>
                <form id="hotkey-form">
                    <div class="form-group">
                        <label>Shortcut Keys</label>
                        <input type="text" id="h-keys" placeholder="Click here to record shortcut" readonly required>
                    </div>
                    <div class="form-group">
                        <label>AI Prompt Prefix</label>
                        <input type="text" id="h-prefix" placeholder="e.g. Translate to Portuguese:" required>
                    </div>
                    <div class="form-group">
                        <label>Target Model</label>
                        <select id="h-model" required>
                            <option value="">Select a model...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <input type="text" id="h-desc" placeholder="e.g. Traduzir texto copiado">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit">Save Hotkey</button>
                        <button type="button" id="h-cancel" style="display:none; background:#cbd5e1; color:#334155;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        let providersMap = {};
        let rawProviders = [];
        let rawModels = [];
        let rawHotkeys = [];

        let editingProviderId = null;
        let editingModelId = null;
        let editingHotkeyId = null;

        async function fetchProviders() {
            const res = await fetch(`${API_URL}/providers`);
            rawProviders = await res.json();
            const list = document.getElementById('providers-list');
            const select = document.getElementById('m-provider');

            list.innerHTML = '';
            select.innerHTML = '<option value="">Select a provider...</option>';
            providersMap = {};

            rawProviders.forEach(p => {
                providersMap[p.id] = p.name;
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                <div class="card-actions">
                    <button class="action-btn edit-btn" onclick="editProvider(${p.id})">Edit</button>
                    <button class="action-btn delete-btn" onclick="deleteProvider(${p.id})">Delete</button>
                </div>
                <div class="card-title">${p.name}</div>
                <div>URL: ${p.base_url}</div>
            `;
                list.appendChild(div);

                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = p.name;
                select.appendChild(option);
            });
        }

        async function fetchModels() {
            const res = await fetch(`${API_URL}/models`);
            rawModels = await res.json();
            const list = document.getElementById('models-list');
            const select = document.getElementById('h-model');

            list.innerHTML = '';
            select.innerHTML = '<option value="">Select a model...</option>';

            rawModels.forEach(m => {
                // Populate list
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                <div class="card-actions">
                    <button class="action-btn edit-btn" onclick="editModel(${m.id})">Edit</button>
                    <button class="action-btn delete-btn" onclick="deleteModel(${m.id})">Delete</button>
                </div>
                <div class="card-title">${m.name}</div>
                <div>Provider: ${providersMap[m.provider_id] || 'Unknown'}</div>
                <div>Model: ${m.model_name}</div>
            `;
                list.appendChild(div);

                // Populate select
                const option = document.createElement('option');
                option.value = m.id;
                option.textContent = m.name;
                select.appendChild(option);
            });
        }

        async function fetchHotkeys() {
            const res = await fetch(`${API_URL}/hotkeys`);
            rawHotkeys = await res.json();

            // Also need models to display model name
            const mRes = await fetch(`${API_URL}/models`);
            const models = await mRes.json();
            const modelMap = {};
            models.forEach(m => modelMap[m.id] = m.name);

            const list = document.getElementById('hotkeys-list');
            list.innerHTML = '';

            rawHotkeys.forEach(h => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                <div class="card-actions">
                    <button class="action-btn edit-btn" onclick="editHotkey(${h.id})">Edit</button>
                    <button class="action-btn delete-btn" onclick="deleteHotkey(${h.id})">Delete</button>
                </div>
                <div class="card-title">${h.keys} ${h.description ? `<span style="font-weight:normal; font-size:0.9em; color:#64748b;">- ${h.description}</span>` : ''}</div>
                <div>Prefix: <em>${h.prefix}</em></div>
                <div>Model: ${modelMap[h.model_id] || 'Unknown'}</div>
            `;
                list.appendChild(div);
            });
        }

        function editProvider(id) {
            const p = rawProviders.find(x => x.id === id);
            if (!p) return;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-baseurl').value = p.base_url;
            document.getElementById('p-apikey').value = '';
            document.getElementById('p-apikey').placeholder = 'Leave blank to keep current key';
            document.getElementById('p-apikey').removeAttribute('required');
            editingProviderId = id;
            document.querySelector('#provider-form button[type="submit"]').textContent = 'Update Provider';
            document.getElementById('p-cancel').style.display = 'block';
            document.querySelector('#provider-form').scrollIntoView({ behavior: 'smooth' });
        }

        function resetProviderForm() {
            document.getElementById('provider-form').reset();
            editingProviderId = null;
            document.querySelector('#provider-form button[type="submit"]').textContent = 'Save Provider';
            document.getElementById('p-apikey').setAttribute('required', 'true');
            document.getElementById('p-apikey').placeholder = 'sk-...';
            document.getElementById('p-cancel').style.display = 'none';
        }
        document.getElementById('p-cancel').addEventListener('click', resetProviderForm);

        document.getElementById('provider-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('p-name').value,
                base_url: document.getElementById('p-baseurl').value,
                api_key: document.getElementById('p-apikey').value,
            };

            if (editingProviderId) {
                if (!payload.api_key) delete payload.api_key;
                await fetch(`${API_URL}/providers/${editingProviderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                await fetch(`${API_URL}/providers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            resetProviderForm();
            await fetchProviders();
            fetchModels(); 
        });

        function editModel(id) {
            const m = rawModels.find(x => x.id === id);
            if (!m) return;
            document.getElementById('m-name').value = m.name;
            document.getElementById('m-provider').value = m.provider_id;
            document.getElementById('m-modelname').value = m.model_name;
            editingModelId = id;
            document.querySelector('#model-form button[type="submit"]').textContent = 'Update Model';
            document.getElementById('m-cancel').style.display = 'block';
            document.querySelector('#model-form').scrollIntoView({ behavior: 'smooth' });
        }

        function resetModelForm() {
            document.getElementById('model-form').reset();
            editingModelId = null;
            document.querySelector('#model-form button[type="submit"]').textContent = 'Save Model';
            document.getElementById('m-cancel').style.display = 'none';
        }
        document.getElementById('m-cancel').addEventListener('click', resetModelForm);

        document.getElementById('model-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('m-name').value,
                provider_id: parseInt(document.getElementById('m-provider').value),
                model_name: document.getElementById('m-modelname').value,
            };

            if (editingModelId) {
                await fetch(`${API_URL}/models/${editingModelId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                await fetch(`${API_URL}/models`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            resetModelForm();
            fetchModels();
            fetchHotkeys();
        });

        function editHotkey(id) {
            const h = rawHotkeys.find(x => x.id === id);
            if (!h) return;
            document.getElementById('h-keys').value = h.keys;
            document.getElementById('h-prefix').value = h.prefix;
            document.getElementById('h-model').value = h.model_id;
            document.getElementById('h-desc').value = h.description || '';
            editingHotkeyId = id;
            document.querySelector('#hotkey-form button[type="submit"]').textContent = 'Update Hotkey';
            document.getElementById('h-cancel').style.display = 'block';
            document.querySelector('#hotkey-form').scrollIntoView({ behavior: 'smooth' });
        }

        function resetHotkeyForm() {
            document.getElementById('hotkey-form').reset();
            editingHotkeyId = null;
            document.querySelector('#hotkey-form button[type="submit"]').textContent = 'Save Hotkey';
            document.getElementById('h-cancel').style.display = 'none';
        }
        document.getElementById('h-cancel').addEventListener('click', resetHotkeyForm);

        document.getElementById('hotkey-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                keys: document.getElementById('h-keys').value,
                prefix: document.getElementById('h-prefix').value,
                model_id: parseInt(document.getElementById('h-model').value),
                description: document.getElementById('h-desc').value,
            };

            if (editingHotkeyId) {
                await fetch(`${API_URL}/hotkeys/${editingHotkeyId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                await fetch(`${API_URL}/hotkeys`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            resetHotkeyForm();
            fetchHotkeys();
        });

        async function deleteProvider(id) {
            if (!confirm('Are you sure?')) return;
            const res = await fetch(`${API_URL}/providers/${id}`, { method: 'DELETE' });
            if (!res.ok) {
                const data = await res.json();
                alert(data.detail || 'Error deleting provider');
            } else {
                fetchProviders();
            }
        }

        async function deleteModel(id) {
            if (!confirm('Are you sure?')) return;
            const res = await fetch(`${API_URL}/models/${id}`, { method: 'DELETE' });
            if (!res.ok) {
                const data = await res.json();
                alert(data.detail || 'Error deleting model');
            } else {
                fetchModels();
                fetchHotkeys();
            }
        }

        async function deleteHotkey(id) {
            if (!confirm('Are you sure?')) return;
            await fetch(`${API_URL}/hotkeys/${id}`, { method: 'DELETE' });
            fetchHotkeys();
        }

        // Hotkey Recording Logic
        const hKeysInput = document.getElementById('h-keys');
        let isRecording = false;
        let pressedKeys = new Set();

        hKeysInput.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isRecording = true;
            hKeysInput.classList.add('recording');
            hKeysInput.value = 'Recording... Press shortcut, then click away';
            pressedKeys.clear();
        });

        document.addEventListener('keydown', (e) => {
            if (!isRecording) return;
            e.preventDefault();

            const key = e.key.toLowerCase();
            let keyName = key;

            if (key === 'control') keyName = 'ctrl';
            if (key === ' ') keyName = 'space';
            if (key === 'meta') keyName = 'win'; // or cmd

            pressedKeys.add(keyName);
            hKeysInput.value = Array.from(pressedKeys).join('+');
        });

        document.addEventListener('keyup', (e) => {
            if (!isRecording) return;
            // Keep keys in the Set to allow multi-key combos
        });

        document.addEventListener('mousedown', (e) => {
            if (isRecording && e.target !== hKeysInput) {
                isRecording = false;
                hKeysInput.classList.remove('recording');
                if (pressedKeys.size === 0) {
                    hKeysInput.value = '';
                } else {
                    hKeysInput.value = Array.from(pressedKeys).join('+');
                }
            }
        });


        // Initial load
        async function init() {
            await fetchProviders();
            await fetchModels();
            fetchHotkeys();
        }
        init();
    </script>
</body>

</html>
